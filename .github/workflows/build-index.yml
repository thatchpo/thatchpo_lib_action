name: Build PyPI Index

on:
  push:
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dumb-pypi
        run: pip install dumb-pypi

      - name: Generate package list
        working-directory: packages
        run: ls *.whl > ../package_list.txt

      - name: Build simple index
        working-directory: packages
        run: |
          dumb-pypi \
            --output-dir ../output \
            --packages-url https://thatchpo.github.io/thatchpo_lib_action/packages/ \
            --package-list ../package_list.txt

      - name: Copy packages into output
        run: |
          mkdir -p ./output/packages
          cp packages/*.whl ./output/packages/

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4